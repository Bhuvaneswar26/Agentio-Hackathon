name: CI
on:
  push: {branches: [main]}
  pull_request:
jobs:
  detection-agent:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: services/detection-agent}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: services/detection-agent/requirements.txt}
      - run: pip install -r requirements.txt
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend/claims-dashboard}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/claims-dashboard/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run build
