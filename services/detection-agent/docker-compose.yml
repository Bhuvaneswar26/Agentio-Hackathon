services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: claimsguard, POSTGRES_PASSWORD: claimsguard, POSTGRES_DB: claimsguard}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U claimsguard"], interval: 5s, retries: 10}
  redis:
    image: redis:7
  api:
    build: .
    env_file: .env.example
    environment:
      CG_DATABASE_URL: postgresql+psycopg://claimsguard:claimsguard@db:5432/claimsguard
      CG_REDIS_URL: redis://redis:6379/0
      CG_EXECUTION_MODE: sync
    ports: ["8000:8000"]
    volumes: ["./ml_models:/app/ml_models"]
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_started}}
  worker:
    build: .
    command: celery -A app.workers.analysis_worker.celery_app worker -l info
    environment:
      CG_DATABASE_URL: postgresql+psycopg://claimsguard:claimsguard@db:5432/claimsguard
      CG_REDIS_URL: redis://redis:6379/0
    volumes: ["./ml_models:/app/ml_models"]
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_started}}
volumes:
  pgdata:
